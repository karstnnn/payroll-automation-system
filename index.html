<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Payslip Automation</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="app">

        <section class="hero">

            <div class="content">

                <h1>Payslip Automation</h1>

                <p class="subtitle">
                    Generate and send employee payslips automatically.
                </p>

                <button
                    id="generateBtn"
                    class="generate-btn"
                >
                    <span class="button-icon">

                        <svg
                            width="28"
                            height="28"
                            viewBox="0 0 32 32"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <path
                                d="M6 3.5H18L25 10.5V27.5C25 28.05 24.55 28.5 24 28.5H6C5.45 28.5 5 28.05 5 27.5V4.5C5 3.95 5.45 3.5 6 3.5Z"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linejoin="round"
                            />

                            <path
                                d="M18 3.5V10.5H25"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linejoin="round"
                            />
                            
                        </svg>

                    </span>

                    <span>
                        Generate &amp; Send Payslips
                    </span>
                </button>

                <div class="status-panel">

                    <div class="status-header">
                        <span>Process Status</span>
                        <span id="processStatus">Ready</span>
                    </div>

                    <div
                        id="logContainer"
                        class="log-container"
                    ></div>

                </div>

            </div>

            <div class="illustration">

                <div class="paper paper-back"></div>

                <div class="paper">

                    <div class="paper-lines">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="paper-section">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="paper-section short">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="signature">
                        <svg
                            viewBox="0 0 100 40"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M5 30
                                   C15 10, 20 35, 28 22
                                   C35 10, 37 30, 45 25
                                   C52 20, 54 10, 60 17
                                   C67 25, 73 28, 80 18
                                   C85 10, 90 14, 95 8"
                            />
                        </svg>
                    </div>

                </div>

            </div>

        </section>

    </main>

    <script src="renderer.js"></script>

</body>

</html>
