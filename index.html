<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Payslip Automation</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="app">

        <section id="homePage" class="hero page">

            <div class="content">

                <h1>Payslip Automation</h1>

                <button
                    id="settingsBtn"
                    class="settings-btn"
                    title="Settings"
                >
                    ⚙
                </button>

                <p class="subtitle">
                    Generate and send employee payslips automatically.
                </p>

                <button
                    id="generateBtn"
                    class="generate-btn"
                >
                    <span class="button-icon">

                        <svg
                            width="28"
                            height="28"
                            viewBox="0 0 32 32"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <path
                                d="M6 3.5H18L25 10.5V27.5C25 28.05 24.55 28.5 24 28.5H6C5.45 28.5 5 28.05 5 27.5V4.5C5 3.95 5.45 3.5 6 3.5Z"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linejoin="round"
                            />

                            <path
                                d="M18 3.5V10.5H25"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linejoin="round"
                            />
                            
                        </svg>

                    </span>

                    <span>
                        Generate &amp; Send Payslips
                    </span>
                </button>

                <div class="status-panel">

                    <div class="status-header">
                        <span>Process Status</span>
                        <span id="processStatus">Ready</span>
                    </div>

                    <div id="summaryPanel" class="summary-panel hidden">

                    <div class="summary-item">
                        <span id="sentCount" class="summary-number success-number">
                            0
                        </span>
                        <span class="summary-label">
                            Sent
                        </span>
                    </div>

                    <div class="summary-item">
                        <span id="failedCount" class="summary-number failed-number">
                            0
                        </span>
                        <span class="summary-label">
                            Failed
                        </span>
                    </div>

                    <div class="summary-item">
                        <span id="skippedCount" class="summary-number skipped-number">
                            0
                        </span>
                        <span class="summary-label">
                            Skipped
                        </span>
                    </div>

                    <div class="summary-item">
                        <span
                            id="alreadySentCount"
                            class="summary-number"
                        >
                            0
                        </span>

                        <span class="summary-label">
                            Already Sent
                        </span>
                    </div>

                </div>

                    <div
                        id="logContainer"
                        class="log-container"
                    ></div>

                </div>

            </div>

            <div class="illustration">

                <div class="paper paper-back"></div>

                <div class="paper">

                    <div class="paper-lines">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="paper-section">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="paper-section short">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="signature">
                        <svg
                            viewBox="0 0 100 40"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M5 30
                                   C15 10, 20 35, 28 22
                                   C35 10, 37 30, 45 25
                                   C52 20, 54 10, 60 17
                                   C67 25, 73 28, 80 18
                                   C85 10, 90 14, 95 8"
                            />
                        </svg>
                    </div>

                </div>

            </div>

        </section>

        <section
            id="settingsPage"
            class="page hidden"
        >

            <div class="settings-header">

                <button
                    id="backBtn"
                    class="back-btn"
                >
                    ← Back
                </button>

                <div>
                    <h2>Settings</h2>

                    <p>
                        Configure payslip generation and email settings.
                    </p>
                </div>

            </div>


            <div class="settings-card">

                <h3>General</h3>


                <div class="form-group">

                    <label for="pdfRootFolder">
                        Payslip Folder
                    </label>

                    <div class="folder-input">

                        <input
                            type="text"
                            id="pdfRootFolder"
                            placeholder="Select Google Drive payslip folder"
                            readonly
                        >

                        <button
                            id="browseFolderBtn"
                            type="button"
                            class="secondary-btn"
                        >
                            Browse
                        </button>

                    </div>

                </div>


                <h3>Google Integration</h3>


                <div class="form-group">

                    <label for="appsScriptUrl">
                        Apps Script URL
                    </label>

                    <input
                        type="text"
                        id="appsScriptUrl"
                        placeholder="https://script.google.com/..."
                    >

                </div>


                <h3>Email / SMTP</h3>


                <div class="form-row">

                    <div class="form-group">

                        <label for="smtpHost">
                            SMTP Host
                        </label>

                        <input
                            type="text"
                            id="smtpHost"
                            placeholder="smtpout.secureserver.net"
                        >

                    </div>


                    <div class="form-group small">

                        <label for="smtpPort">
                            Port
                        </label>

                        <input
                            type="number"
                            id="smtpPort"
                            placeholder="465"
                        >

                    </div>

                </div>


                <div class="form-group checkbox-group">

                    <input
                        type="checkbox"
                        id="smtpSecure"
                    >

                    <label for="smtpSecure">
                        Use secure SSL/TLS connection
                    </label>

                </div>


                <div class="form-group">

                    <label for="smtpUser">
                        Sender Email
                    </label>

                    <input
                        type="email"
                        id="smtpUser"
                        placeholder="payroll@company.com"
                    >

                </div>


                <div class="form-group">

                    <label for="smtpPassword">
                        Email Password
                    </label>

                    <input
                        type="password"
                        id="smtpPassword"
                        placeholder="••••••••••••"
                    >

                </div>


                <div class="settings-actions">

                    <button
                        id="testConnectionBtn"
                        class="secondary-btn"
                    >
                        Test Email Connection
                    </button>


                    <button
                        id="saveSettingsBtn"
                        class="generate-btn"
                    >
                        Save Settings
                    </button>

                </div>

                <p
                    id="settingsStatus"
                    class="settings-status"
                ></p>

            </div>

        </section>
    </main>

    <script src="renderer.js"></script>

</body>

</html>
